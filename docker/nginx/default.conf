server {
    # Accept HTTP traffic on port 80 inside the nginx container.
    listen 80;

    # "_" acts as a catch-all host name for local/dev or container setups.
    server_name _;

    # Only expose Laravel's public directory to the web.
    root /var/www/html/public;

    # Default files to serve when a directory is requested.
    index index.php index.html;

    # Send text responses as UTF-8.
    charset utf-8;  

    # Allow request bodies/uploads up to 64 MB.
    client_max_body_size 64M;

    # Basic hardening headers.
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # First try a real file or folder; otherwise hand the request to Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Avoid noisy logs for common browser requests.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Execute PHP files through the PHP-FPM service named "app".
    location ~ \.php$ {
        fastcgi_pass app:9000;

        # Tell PHP-FPM the exact script path to run.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Hide PHP implementation details from response headers.
        fastcgi_hide_header X-Powered-By;

        # Wait up to 60 seconds for PHP to finish processing.
        fastcgi_read_timeout 60; 
    }

    # Forward Reverb WebSocket traffic to the dedicated reverb container.
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;

        # Required headers for the HTTP -> WebSocket upgrade handshake.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Preserve original request details for the upstream service.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived socket connections open.
        proxy_read_timeout 86400;
    }

    # Block access to hidden files like .env, except for .well-known paths.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
