services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-drone_monitoring}
      DB_USERNAME: ${DB_USERNAME:-drone}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      REVERB_HOST: ${REVERB_HOST:-0.0.0.0}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_APP_ID: ${REVERB_APP_ID:-drone-monitoring}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-drone-monitoring-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-drone-monitoring-secret}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drone-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - drone-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-drone_monitoring}
      MYSQL_USER: ${DB_USERNAME:-drone}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - drone-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - drone-network
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-drone_monitoring}
      DB_USERNAME: ${DB_USERNAME:-drone}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_APP_ID: ${REVERB_APP_ID:-drone-monitoring}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-drone-monitoring-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-drone-monitoring-secret}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drone-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  drone-network:
    driver: bridge
